name: Build & Analyze the app on PR

on: ["pull_request"]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable

      - name: Install Dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Analyze Code
        run: flutter analyze
        working-directory: mobile

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable

      - name: Install Dependencies
        run: flutter pub get
        working-directory: mobile
        
      - name: Build APK
        run: flutter build apk --debug
        working-directory: mobile

  build-aab:
    name: Build App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable

      - name: Install Dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Build App Bundle
        run: flutter build appbundle --debug
        working-directory: mobile
